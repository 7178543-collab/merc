name: merc-actor
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      live:
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: merc-actor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Write creds
        env:
          MERC_CREDS: ${{ secrets.MERC_CREDS }}
        run: printf '%s\n' "$MERC_CREDS" > ~/.merc_creds && chmod 600 ~/.merc_creds
      - name: Run actor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh issue list --label merc-paused --state open --json number --jq length)" != "0" ]; then
            echo "PAUSED (/pause) - actor skipped; /resume to re-enable"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.live }}" = "true" ]; then
            python merc_actor.py --live --quiet
          else
            python merc_actor.py
          fi
      - name: Alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.live }}" = "true" ]; then
            python alerts.py --live
          else
            python alerts.py
          fi
      - name: Save history
        if: github.event_name == 'schedule' || inputs.live
        run: |
          if [ -d history ]; then
            git config user.name "merc-bot"
            git config user.email "merc-bot@users.noreply.github.com"
            git add -f history  # -f: .gitignore has *.jsonl
            git diff --cached --quiet || { git commit -q -m "history $(date -u +%Y-%m-%dT%H:%MZ)" && git pull -q --rebase && git push -q; }
          fi
