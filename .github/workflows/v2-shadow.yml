name: v2-shadow
# Bot v2: reads the game once an hour, plans every order, writes state/v2/ (snapshot, plan, report,
# history), then v2/act.py sends orders ONLY for items listed in v2/config.json live.items (v1 skips those).
# Empty list = read-only, as before.
on:
  schedule:
    # mid-turn: after v1's early run (:01) and clear of the turn tick (~:59-:00), so a write never lands on the tick
    - cron: '25 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: merc-actor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write creds
        env:
          MERC_CREDS: ${{ secrets.MERC_CREDS }}
        run: printf '%s\n' "$MERC_CREDS" > ~/.merc_creds && chmod 600 ~/.merc_creds
      - name: v2 shadow (read-only)
        run: python v2/shadow.py || true
      - name: v2 act (writes only items listed in v2/config.json live.items; dry run for the rest)
        run: |
          if [ "$(gh issue list --label merc-paused --state open --json number --jq length 2>/dev/null || echo 0)" != "0" ]; then
            echo "PAUSED (/pause) - v2 act skipped"
          else
            python v2/act.py --live || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save
        run: |
          git config user.name "merc-bot"
          git config user.email "merc-bot@users.noreply.github.com"
          git add -f state/v2 state/order_queue_done.jsonl
          git diff --cached --quiet || { git commit -q -m "v2 shadow $(date -u +%Y-%m-%dT%H:%MZ)" && for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done; }
